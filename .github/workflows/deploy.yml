name: Deploy to FTP server

on:
  push:
    branches:
      - master

jobs:
  ftp-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Собирает dist/: форму входа (server/*.php), приложение в app/ и
      # статику в assets/*.dat. Подробности — в комментарии build.mjs.
      - name: Build dist
        run: node build.mjs

      # Выкладывается только содержимое dist/, поэтому список исключений
      # не нужен: лишние файлы туда просто не попадают.
      # config.php (хеш пароля) создаётся на сервере через setup.php, в dist
      # не входит и деплоем не затрагивается — вход переживает выкладку.
      - name: Deploy files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftps
          # У FTP-сервера хостинга самоподписанный сертификат (CN=web-3.cloud4box.com,
          # issuer тот же), поэтому строгая проверка обрывает соединение. loose
          # оставляет шифрование канала, но не требует доверенного сертификата.
          security: loose
          # Крупные .dat (main.js ~0.5 МБ) не должны обрываться по таймауту
          timeout: 120000
