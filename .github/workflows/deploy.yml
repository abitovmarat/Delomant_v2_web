name: Deploy to FTP server

on:
  push:
    branches:
      - master

jobs:
  ftp-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Собирает dist/: форму входа (server/*.php), приложение в app/ и
      # статику в assets/*.dat. Подробности — в комментарии build.mjs.
      - name: Build dist
        run: node build.mjs

      # Выкладываем через lftp одной FTPS-сессией. Прежние варианты падали:
      # FTP-Deploy-Action обрывался на крупном main.js.dat, а curl-цикл
      # открывал новое соединение на каждый файл (хрупкий exit code, риск
      # rate-limit сервера). lftp mirror заливает всё за один логин.
      #
      # mirror без --delete не трогает config.php (хеш пароля создаётся на
      # сервере через setup.php, в dist не входит) — вход переживает выкладку.
      - name: Deploy via lftp (FTPS)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y lftp
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set net:max-retries 2;
            set net:timeout 60;
            open -u '$FTP_USERNAME','$FTP_PASSWORD' '$FTP_SERVER';
            mirror -R --verbose --no-perms ./dist/ '$FTP_SERVER_DIR';
          "
          echo 'Deploy complete.'
