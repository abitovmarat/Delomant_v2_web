name: Deploy to FTP server

on:
  push:
    branches:
      - master

jobs:
  ftp-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Собирает dist/: форму входа (server/*.php), приложение в app/ и
      # статику в assets/*.dat. Подробности — в комментарии build.mjs.
      - name: Build dist
        run: node build.mjs

      # Выкладываем каждый файл через curl по FTPS. Раньше использовался
      # SamKirkland/FTP-Deploy-Action, но его TLS-клиент стабильно обрывался
      # на крупном assets/main.js.dat (~0,5 МБ) при самоподписанном
      # сертификате хостинга. curl -k заливает такие файлы надёжно.
      #
      # config.php (хеш пароля) создаётся на сервере через setup.php, в dist
      # не входит и не перезаписывается — вход переживает выкладку.
      - name: Deploy via curl (FTPS)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -e
          cd dist
          # Нормализуем каталог назначения: гарантируем один слэш в конце
          DEST="${FTP_SERVER_DIR%/}/"
          find . -type f | sed 's|^\./||' | while read -r rel; do
            echo "→ $rel"
            curl -sS --ssl-reqd -k --ftp-create-dirs --max-time 300 --retry 2 \
              -u "$FTP_USERNAME:$FTP_PASSWORD" \
              -T "$rel" "ftp://${FTP_SERVER}${DEST}${rel}"
          done
          echo "Готово: выложено $(find . -type f | wc -l) файлов"
